[project]
name = "Telegram-Multi-Platform-Forwarder"
version = "2.0.0"
description = "Telegram 频道消息同步转发机器人，支持同步至 QQ (Napcat)、Discord 和飞书，支持文本、链接、图片和视频媒体消息的转发。"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.1.0",
    "python-telegram-bot>=22.0",
    "httpx>=0.28.1",
]
